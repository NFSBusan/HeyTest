# Copy to .github/workflows/paper-trading.yml to run the paper trader after each US close.
# Needs repository secrets: TIINGO_API_KEY (and optionally QRP_ALERT_WEBHOOK).
# The paper ledger (data/qrp/paper.duckdb) and research DB are kept between runs as a cache.
# For anything you care about, also back them up to R2/B2.
name: paper-trading
on:
  schedule:
    - cron: "17 22 * * 1-5"      # 22:17 UTC on weekdays, after the US close
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: data/qrp
          key: qrp-state-${{ github.run_id }}
          restore-keys: qrp-state-
      - run: pip install -e .
      - run: python -m qrp --set data.provider=tiingo paper run
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          QRP_ALERT_WEBHOOK: ${{ secrets.QRP_ALERT_WEBHOOK }}
      - run: python -m qrp paper status
