[project]
name = "qrp"
version = "0.1.0"
description = "Quant research platform: generate, backtest and validate trading strategies without fooling yourself."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "duckdb>=1.1",
    "scipy>=1.13",
    "numba>=0.60",
    "optuna>=4.0",
    "pyyaml>=6",
    "requests>=2.31",
]

[project.optional-dependencies]
claude = ["anthropic>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
qrp = "qrp.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
